<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Pages/Styles/integrador.css">
    <title>Integrador</title>
    <link rel="icon" type="image/jpeg" href="/assets/logoCambai.jpeg">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <button id="menu-toggle" class="logo-toggle" aria-label="Abrir ou fechar menu" aria-expanded="false" aria-controls="menu">
            <a href="/index.html"><ref><img src="/assets/logo_cambai_branco.png" alt="Logo Cambaí Sementes"></ref></a>
        </button>

        <nav id="menu">
            <a href="/Pages/reserva.html">
                <img src="/assets/warehouse-alt.png" alt="">
                <span>Reserva</span>
            </a>
            <a href="/Pages/registros.html">
                <img src="/assets/deposit.png" alt="">
                <span>Registros</span>
            </a>
            <a href="/Pages/integrador.html">
                <img src="/assets/plug-connection.png" alt="">
                <span>Integrador</span>
            </a>
        </nav>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <script>
        const toggle = document.getElementById("menu-toggle");
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebar-backdrop");

        function setSidebar(open) {
            sidebar.classList.toggle("expanded", open);
            backdrop.classList.toggle("active", open);
            toggle.setAttribute("aria-expanded", open);
        }

        toggle.addEventListener("click", () => {
            setSidebar(!sidebar.classList.contains("expanded"));
        });

        backdrop.addEventListener("click", () => setSidebar(false));

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") setSidebar(false);
        });

        document.querySelectorAll("#menu a").forEach((link) => {
            link.addEventListener("click", () => setSidebar(false));
        });
    </script>

    <div class="container">
        <div class="toolbar">
            <div class="search-bar">
                <input type="text" id="input-search" placeholder="Pesquisar por impressora...">
                <button type="button" id="btn-search">
                    <img src="/assets/search.png" alt="Ícone de pesquisa" width="20" height="20">
                </button>
            </div>
            <button class="btn-primary" onclick="gerarReservas()">Estoque completo</button>
            <button class="btn-primary" onclick="gerarRegistros()">Histórico de registros</button>
        </div>

        <div class="preview-section">
            <div class="email-preview">
                <h2>Pré-visualização</h2>
                <pre id="previewConteudo">Visualização do conteúdo do relatório antes do envio.</pre>
            </div>
            <div class="preview-actions">
                <button class="btn-success" onclick="enviarEmail()">Enviar ao Pipefy</button>
                <button class="btn-danger" onclick="limparTudo()">Limpar</button>
            </div>
        </div>
    </div>

    <form
        id="formPipefy"
        action="https://formspree.io/f/xbdzgyqg"
        method="POST"
        style="display:none;"
    >
        <input type="email" name="email" id="emailRemetente">
        <textarea name="message" id="mensagemEmail"></textarea>

        <input type="hidden" name="_subject" value="Relatório Integrador Pipefy">
        <input type="hidden" name="_captcha" value="false">
    </form>

    <footer style="margin:80px 0 40px; text-align:center; color:#666; font-size:14.5px;">
        Sistema desenvolvido e mantido pela <strong>Equipe do GI</strong><br>
        Cambaí Sementes © 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/Pages/Logic/integrador.js"></script>
</body>
</html>
